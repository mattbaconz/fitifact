schema: fitifact.profile/v1
id: discord/file-upload-nitro-basic
name: Discord Nitro Basic file upload
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: discord
  feature: file-upload
  account_tier: nitro-basic

constraints:
  - id: bytes
    field: file.bytes
    op: lte
    value: 50000000
    source: src-attachments

preferences:
  preserve:
    resolution: high
    audio: high

sources:
  - id: src-attachments
    type: official-doc
    url: https://support.discord.com/hc/en-us/articles/25444343291031-File-Attachments-FAQ
    observed_at: 2026-10-17
    note: "\"Nitro Basic offers 50MB.\" Integer is 50000000 as published. Fitifact never detects Nitro; this profile is the cap you set. Discord says it is experimenting with upload limits, so some accounts see larger caps."

tests:
  - fixture: media/compatible-h264-aac.mp4
    expect: compatible-or-adapt
