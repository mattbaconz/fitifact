schema: fitifact.profile/v1
id: discord/file-upload
name: Discord free file upload
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: discord
  feature: file-upload
  account_tier: free

constraints:
  - id: bytes
    field: file.bytes
    op: lte
    value: 20000000
    source: src-attachments

preferences:
  preserve:
    resolution: high
    audio: high

sources:
  - id: src-attachments
    type: official-doc
    url: https://support.discord.com/hc/en-us/articles/25444343291031-File-Attachments-FAQ
    observed_at: 2026-10-17
    note: "For non-Nitro accounts the maximum upload is 20 MB (20000000 as published). Fitifact never detects Nitro; this profile is the cap you set. Discord says it is experimenting with upload limits, so some accounts see larger caps."

tests:
  - fixture: media/compatible-h264-aac.mp4
    expect: compatible-or-adapt
