schema: fitifact.profile/v1
id: discord/image-upload-nitro-basic
name: Discord Nitro Basic image upload
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: discord
  feature: image-upload
  account_tier: nitro-basic

constraints:
  - id: format
    field: image.format
    op: in
    value: [jpeg, png, webp]
    source: src-fitifact-image
  - id: bytes
    field: file.bytes
    op: lte
    value: 20000000
    source: src-attachments

preferences:
  preserve:
    resolution: high

sources:
  - id: src-attachments
    type: official-doc
    url: https://support.discord.com/hc/en-us/articles/25444343291031-File-Attachments-FAQ
    observed_at: 2026-10-17
    note: "\"Any image that is larger than 20MB will be shared as a download instead.\" Integer is 20000000 as published. Nitro raises the file cap, but an image over 20 MB still arrives as a download, so this profile keeps the 20 MB inline ceiling. Discord says it is experimenting with upload limits, so some accounts see larger caps."
  - id: src-fitifact-image
    type: fitifact-rule
    observed_at: 2026-10-17
    note: "Fitifact rule: Discord's FAQ lists no still-image formats. Output is limited to JPEG, PNG, and WebP, the still formats Fitifact can produce. Not emoji, sticker, or avatar rules."

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt
