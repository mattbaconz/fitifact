schema: fitifact.profile/v1
id: x/image
name: X image
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: x
  feature: image-post

constraints:
  - id: format
    field: image.format
    op: in
    value: [gif, jpeg, png]
    source: src-pictures
  - id: bytes
    field: file.bytes
    op: lte
    value: 5000000
    source: src-pictures

preferences:
  preserve:
    resolution: high

sources:
  - id: src-pictures
    type: official-doc
    url: https://help.x.com/en/using-x/posting-gifs-and-pictures
    observed_at: 2026-10-17
    note: "Photos up to 5 MB; GIFs up to 5 MB on mobile and 15 MB on the web. X accepts GIF, JPEG, and PNG, not BMP, TIFF, or other formats. This profile keeps 5 MB for every image."
  - id: src-api
    type: official-api
    url: https://docs.x.com/x-api/media/quickstart/best-practices
    observed_at: 2026-10-17
    note: "Conflict, recorded not resolved: the X API also accepts WEBP images up to 5 MB. This profile follows the Help Center, which governs posting on x.com."

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt
