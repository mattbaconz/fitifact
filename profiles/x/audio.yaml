schema: fitifact.profile/v1
id: x/audio
name: X audio
revision: 1
last_verified: 2026-08-31

scope:
  kind: web-upload
  platform: x
  feature: audio

trust:
  level: documented

constraints:
  - id: bytes
    field: file.bytes
    op: lte
    value: 16000000
    source: src-media

preferences:
  preserve:
    resolution: high
    audio: high

sources:
  - id: src-media
    type: official-doc
    url: https://help.x.com/en/using-x/x-media
    observed_at: 2026-08-31
    note: X media sends are size-capped. Playback rules are extra and undocumented here.

tests:
  - fixture: media/compatible-h264-aac.mp4
    expect: compatible-or-adapt
