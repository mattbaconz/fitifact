schema: fitifact.profile/v1
id: slack/file-image
name: Slack file image
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: slack
  feature: file-image

constraints:
  - id: format
    field: image.format
    op: in
    value: [jpeg, png, gif, webp]
    source: src-fitifact-image
  - id: max-width
    field: image.width
    op: lte
    value: 24999
    source: src-files
  - id: max-height
    field: image.height
    op: lte
    value: 24999
    source: src-files
  - id: bytes
    field: file.bytes
    op: lte
    value: 1000000000
    source: src-files

preferences:
  preserve:
    resolution: high

sources:
  - id: src-files
    type: official-doc
    url: https://slack.com/help/articles/201330736-Add-files-to-Slack
    observed_at: 2026-10-17
    note: "Files up to 1GB. An image previews inline only if it is smaller than 25,000 pixels on the longest side and less than 45 million pixels in total; Fitifact enforces the edge limit but cannot yet check the pixel total."
  - id: src-fitifact-image
    type: fitifact-rule
    observed_at: 2026-10-17
    note: "Fitifact rule: Slack lists no image formats. These are common web image formats that browsers preview."

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt
