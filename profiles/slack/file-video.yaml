schema: fitifact.profile/v1
id: slack/file-video
name: Slack file video
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: slack
  feature: file-video

constraints:
  - id: container
    field: media.container
    op: in
    value: [mp4]
    source: src-fitifact-codec
  - id: video-codec
    field: media.video.codec
    op: in
    value: [h264]
    source: src-fitifact-codec
  - id: audio-codec
    field: media.audio.codec
    op: in
    value: [aac]
    source: src-fitifact-codec
  - id: pixel-format
    field: media.video.pixel_format
    op: in
    value: [yuv420p, yuvj420p]
    source: src-fitifact-picture
  - id: bit-depth
    field: media.video.bit_depth
    op: lte
    value: 8
    source: src-fitifact-picture
  - id: sdr
    field: media.video.hdr
    op: in
    value: [sdr, unknown]
    source: src-fitifact-picture
  - id: bytes
    field: file.bytes
    op: lte
    value: 1000000000
    source: src-files

preferences:
  preserve:
    resolution: high
    audio: high

sources:
  - id: src-files
    type: official-doc
    url: https://slack.com/help/articles/201330736-Add-files-to-Slack
    observed_at: 2026-10-17
    note: "\"You can add files up to 1GB in size.\""
  - id: src-fitifact-codec
    type: fitifact-rule
    observed_at: 2026-10-17
    note: "Fitifact rule: Slack documents no playback formats. Fitifact produces MP4 with H.264 video and AAC audio, the most widely supported web video format."
  - id: src-fitifact-picture
    type: fitifact-rule
    observed_at: 2026-10-17
    note: "Fitifact rule, not a destination statement: H.264 video plays reliably everywhere only as 8-bit 4:2:0 SDR. 10-bit, 4:2:2/4:4:4, and HDR H.264 often fail to play or show wrong colors, so they are re-encoded. Untagged video counts as SDR because players show it that way."

tests:
  - fixture: media/compatible-h264-aac.mp4
    expect: compatible-or-adapt

history:
  - revision: 2
    date: 2026-10-17
    change: "Added Fitifact's picture rules (8-bit 4:2:0 SDR) and marked the MP4, H.264, and AAC requirement as a Fitifact rule, not a Slack limit."
  - revision: 1
    date: 2026-08-26
    change: "First published."
