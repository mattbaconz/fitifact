schema: fitifact.profile/v1
id: slack/file-upload
name: Slack file upload
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: slack
  feature: file-upload

constraints:
  - id: bytes
    field: file.bytes
    op: lte
    value: 1000000000
    source: src-files

preferences:
  preserve:
    resolution: high
    audio: high

sources:
  - id: src-files
    type: official-doc
    url: https://slack.com/help/articles/201330736-Add-files-to-Slack
    observed_at: 2026-10-17
    note: "\"You can add files up to 1GB in size.\" Playback rules are extra and undocumented here."

tests:
  - fixture: media/compatible-h264-aac.mp4
    expect: compatible-or-adapt

history:
  - revision: 2
    date: 2026-10-17
    change: "Sources re-checked; no limit changed."
  - revision: 1
    date: 2026-10-16
    change: "First published."
