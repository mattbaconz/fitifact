schema: fitifact.profile/v1
id: github/comment-image
name: GitHub comment image
revision: 2
last_verified: 2026-10-17

scope:
  kind: web-upload
  platform: github
  feature: comment-image

constraints:
  - id: format
    field: image.format
    op: in
    value: [gif, jpeg, png]
    source: src-attach
  - id: bytes
    field: file.bytes
    op: lte
    value: 10000000
    source: src-attach

preferences:
  preserve:
    resolution: high

sources:
  - id: src-attach
    type: official-doc
    url: https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/attaching-files
    observed_at: 2026-10-17
    note: "Images and GIFs up to 10 MB in issues, pull requests, and comments. Supported image types are PNG, GIF, JPEG, and SVG; Fitifact cannot produce SVG, and WebP is not listed."

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt
