schema: fitifact.profile/v1
id: whatsapp/photo
name: WhatsApp photo
revision: 2
last_verified: 2026-08-28

scope:
  kind: web-upload
  platform: whatsapp
  feature: photo

constraints:
  - id: format
    field: image.format
    op: in
    value: [jpeg]
    source: src-photo
  - id: bytes
    field: file.bytes
    op: lte
    value: 16000000
    source: src-photo

preferences:
  preserve:
    resolution: high

sources:
  - id: src-photo
    type: official-doc
    url: https://faq.whatsapp.com/1317564962315842
    observed_at: 2026-08-28
    note: Meta documents sending photos up to 16 MB. WhatsApp may recompress on the wire. This profile is the send ceiling, not a promise the compressed preview matches these bytes. On 2026-10-17 this URL showed an unrelated article, and the current media FAQ states no photo cap, so the 16 MB rule is unverified and shown as stale.

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt

history:
  - revision: 2
    date: 2026-10-17
    change: "The cited WhatsApp page no longer shows a photo limit, so the 16 MB rule is kept but unverified."
  - revision: 1
    date: 2026-08-29
    change: "First published."
