schema: fitifact.profile/v1
id: whatsapp/photo
name: WhatsApp photo
revision: 3
last_verified: 2026-08-28

scope:
  kind: web-upload
  platform: whatsapp
  feature: photo

constraints:
  - id: format
    field: image.format
    op: in
    value: [jpeg]
    source: src-photo

preferences:
  preserve:
    resolution: high

sources:
  - id: src-photo
    type: official-doc
    url: https://faq.whatsapp.com/1317564962315842
    observed_at: 2026-08-28
    note: Meta used to document sending photos up to 16 MB here. On 2026-10-17 this URL showed an unrelated article, and the current WhatsApp media FAQ lists video and document limits but no photo limit, so this profile sets no size limit. WhatsApp may recompress photos on the wire.

tests:
  - fixture: image/compatible-jpeg.jpg
    expect: compatible-or-adapt

history:
  - revision: 3
    date: 2026-10-19
    change: "Removed the 16 MB limit: WhatsApp's media FAQ lists no photo limit, so Fitifact applies none."
  - revision: 2
    date: 2026-10-17
    change: "The cited WhatsApp page no longer shows a photo limit, so the 16 MB rule is kept but unverified."
  - revision: 1
    date: 2026-08-29
    change: "First published."
