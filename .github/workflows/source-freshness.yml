name: Source freshness

# Weekly check that each destination profile's sources still say what its rules quote.
# Schedules run only on the default branch. A manual run reports only, unless asked to
# open the tracking issue.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      open_issue:
        description: Open or update the tracking issue when something needs review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: check destination sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - name: Test the checker
        run: node --test "scripts/*.test.mjs"
      - name: Check every cited source
        id: check
        run: node scripts/check-source-freshness.mjs --report "$RUNNER_TEMP/freshness.md"
      - name: Open or update the tracking issue
        if: steps.check.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.open_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/freshness.md
        run: |
          gh label create source-freshness --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "A destination source changed or a profile is stale" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label source-freshness --state open \
            --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label source-freshness \
              --title "Destination sources need review" --body-file "$REPORT"
          fi
