# Unsigned Windows desktop installer with shipped FFmpeg sidecars.
# Consumers do not install FFmpeg or edit PATH. SmartScreen will warn.

name: Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows installer
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.5.1
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Install locked documentation dependencies
        working-directory: apps/docs
        run: npm ci
      - name: Install locked desktop CLI
        working-directory: apps/desktop
        run: npm ci
      - name: Fetch FFmpeg sidecars
        working-directory: apps/desktop
        run: npm run sidecar
      - name: Package unsigned Windows app
        working-directory: apps/desktop
        run: npm run build
      # tauri-build needs the sidecars and web/dist, which packaging produces.
      - name: Desktop host tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Assert shipped FFmpeg next to the app
        run: ./scripts/check-desktop-bundle.ps1
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
