name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Fixture integrity
        shell: pwsh
        run: ./scripts/check-fixtures.ps1
      - name: Documentation links
        shell: pwsh
        run: ./scripts/check-doc-links.ps1
      - name: Workflow syntax and pins
        shell: pwsh
        run: ./scripts/check-workflows.ps1

  web:
    name: static web product
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.5.1
      - name: Record and enforce web toolchain
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.6.0") { throw "Unexpected Node version: $(node --version)" }
          if ((npm --version) -ne "11.5.1") { throw "Unexpected npm version: $(npm --version)" }
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install locked web dependencies
        run: npm ci
      - name: Install pinned browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Web lint and typecheck
        run: npm run lint
      - name: Web unit tests and real HEIC decode
        run: npm test
      - name: Default static build
        run: npm run build
      - name: Verify default artifact includes lazy HEIC decoder
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/assets -File | ForEach-Object Name)
          if (-not ($assets -match '^(?:heic-decoder|wasm-bundle)-')) {
            throw "Default artifact is missing the lazy HEIC decoder"
          }
          $html = Get-Content -Raw -LiteralPath dist/index.html
          if ($html -match 'heic-decoder|wasm-bundle') {
            throw "index.html eagerly references the HEIC decoder"
          }
      - name: Decoder-free HEIC gate
        env:
          FITIFACT_HEIC_APPROVED: "false"
        run: npm run test:e2e:heic-off
      - name: Decoder-free static build proof
        env:
          FITIFACT_HEIC_APPROVED: "false"
        shell: pwsh
        run: |
          npm run build
          $assets = @(Get-ChildItem -LiteralPath dist/assets -File | ForEach-Object Name)
          if ($assets -match '^(?:heic-decoder|wasm-bundle)-') {
            throw "Decoder-free build unexpectedly contains the gated HEIC decoder"
          }
      - name: Browser workflow tests
        run: npm run test:e2e
      - name: Build GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FITIFACT_BASE_PATH: /fitifact/
        run: npm run build
      - name: Verify public Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/assets -File | ForEach-Object Name)
          if (-not ($assets -match '^(?:heic-decoder|wasm-bundle)-')) {
            throw "Public Pages artifact is missing the lazy HEIC decoder"
          }
          $html = Get-Content -Raw -LiteralPath dist/index.html
          if ($html -match 'heic-decoder|wasm-bundle') {
            throw "Pages index.html eagerly references the HEIC decoder"
          }
          if (-not $html.Contains('/fitifact/assets/')) {
            throw "Pages artifact does not use the /fitifact/ base path"
          }
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy-pages:
    name: deploy static web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - web
      - platform
      - msrv
      - supply-chain
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  platform:
    name: platform (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install FFmpeg 7.1.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg-full --version=7.1.1 --yes --no-progress
      - name: Install Ubuntu FFmpeg package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install versioned FFmpeg 7 formula on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Record native toolchain and provider
        shell: pwsh
        run: |
          rustc -vV
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Add native Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build native target
        run: cargo build --locked --workspace --target ${{ matrix.target }}
      - name: Test native target
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}
      - name: Run live FFmpeg suite
        run: cargo test --locked -p fitifact --test live_ffmpeg --target ${{ matrix.target }} -- --ignored --nocapture
      - name: Doctor smoke
        run: cargo run --locked -p fitifact-cli --target ${{ matrix.target }} -- doctor
      - name: Bench smoke
        run: cargo run --locked -p fitifact-cli --target ${{ matrix.target }} -- bench --json

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with MSRV
        run: cargo +1.85.0 check --locked --workspace --all-targets
      - name: Test with MSRV
        run: cargo +1.85.0 test --locked --workspace --all-targets

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Audit advisories
        run: cargo audit
      - name: Enforce dependency policy
        run: cargo deny check
      - name: Public-readiness scan
        shell: pwsh
        run: ./scripts/check-public-readiness.ps1 -RequireDependencyTools
