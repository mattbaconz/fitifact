name: Prepare RC2 lockfile

on:
  push:
    branches:
      - release/v0.1.0-rc.2

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - name: Regenerate lockfile
        run: cargo check --workspace
      - name: Verify lockfile-only generated change
        shell: bash
        run: |
          git diff --exit-code -- Cargo.toml crates/fitifact-cli/Cargo.toml crates/fitifact-wasm/Cargo.toml
          test -n "$(git status --short -- Cargo.lock)"
          git diff -- Cargo.lock
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: regenerate lockfile for v0.1.0-rc.2"
          git push origin HEAD:release/v0.1.0-rc.2
