[package]
name = "fitifact-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Fitifact local WASM bindings for the D-026 consumer image workflow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fitifact = { version = "=0.1.0-rc.5", path = "../fitifact" }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
