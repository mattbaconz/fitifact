[package]
name = "shoehorn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Thin CLI for the Shoehorn compatibility engine"

[[bin]]
name = "shoehorn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
shoehorn = { path = "../shoehorn" }
