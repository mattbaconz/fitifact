[package]
name = "fitifact-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "CLI for the Fitifact compatibility engine"

[package.metadata.dist]
dist = true

[[bin]]
name = "fitifact"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fitifact = { version = "=0.1.0-rc.4", path = "../fitifact" }
