[package]
name = "fitifact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Fitifact destination-first file compatibility engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.4"
thiserror = "2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
gif = { version = "0.14.2", default-features = false, features = ["std", "color_quant"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
