<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-hJiNkrOe90bE82RJbkOGCg2Rj/gIhZR7HV4pg5/gw48='; base-uri 'none'; form-action 'none'" />
    <meta name="robots" content="noindex" />
    <title>Fitifact has moved to fitifact.com</title>
    <!-- GitHub Pages can't send HTTP redirects. This page is deployed as both
         index.html and 404.html, so every old /fitifact/ path lands on the
         same path at fitifact.com (D-046). -->
    <script>location.replace("https://fitifact.com" + (location.pathname.replace(/^\/fitifact(?=\/|$)/, "") || "/") + location.search + location.hash);</script>
    <meta http-equiv="refresh" content="0; url=https://fitifact.com/" />
  </head>
  <body>
    <p>Fitifact has moved to <a href="https://fitifact.com/">fitifact.com</a>.</p>
  </body>
</html>
