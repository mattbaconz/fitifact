<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitifact</title>
    <link rel="stylesheet" href="../../web/public/brand/tokens.css" />
    <link rel="stylesheet" href="../../web/public/brand/components.css" />
    <link rel="stylesheet" href="./src/extension.css" />
    <script type="module" src="./src/panel.ts"></script>
  </head>
  <body>
    <main class="sheet ft-card" id="sheet">
      <header class="bar">
        <img class="mark" src="../../web/public/ft-mark.svg" alt="" width="18" height="18" />
        <span class="brand">Fitifact</span>
        <span class="count ft-numeric" id="count" hidden></span>
        <select class="ft-field plan" id="plan" aria-label="Your Discord plan" hidden></select>
      </header>
      <section class="status" aria-live="polite">
        <h1 id="title">Fitifact</h1>
        <p class="name" id="name" hidden></p>
        <p class="facts ft-numeric" id="facts" hidden></p>
        <p class="detail" id="detail" hidden></p>
        <dl class="rows" id="rows" hidden></dl>
        <div class="progress" id="progress" role="progressbar" aria-label="Progress" hidden><div class="fill" id="fill"></div></div>
        <p class="ft-notice note" id="notice" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="notice-icon" /></svg>
          <span id="notice-text"></span>
        </p>
      </section>
      <div class="choose" id="choose" hidden>
        <label class="field">
          <span>Where it's going</span>
          <select class="ft-field" id="destination"></select>
        </label>
        <button class="ft-btn ft-btn-block" type="button" id="pick">Choose a video</button>
        <input id="file" type="file" accept="video/*,.mkv,.mov" hidden />
      </div>
      <div class="actions">
        <button class="ft-btn" type="button" id="fit" hidden></button>
        <a class="ft-btn" id="download" hidden></a>
        <button class="ft-btn ft-btn-secondary" type="button" id="original" hidden>Use original</button>
        <button class="ft-btn ft-btn-text" type="button" id="cancel" hidden>Cancel</button>
      </div>
      <p class="foot">Runs on this device. Nothing is uploaded.</p>
    </main>
  </body>
</html>
