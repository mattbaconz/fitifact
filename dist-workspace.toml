[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
hosting = ["github"]
packages = ["fitifact-cli"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["shell", "powershell"]
checksum = "sha256"
unix-archive = ".tar.gz"
windows-archive = ".zip"
cargo-cyclonedx = true
github-attestations = true
github-attestations-phase = "host"
github-attestations-filters = [
    "*.zip",
    "*.tar.gz",
    "*.sha256",
    "sha256.sum",
    "*.sh",
    "*.ps1",
    "*.cdx.xml",
]
github-release = "host"
pr-run-mode = "plan"
# cargo-dist cannot emit trailing version comments after SHA refs. The checked-in
# workflow is generated by 0.32.0, then annotated and least-privilege hardened.
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2025"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-15"

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
